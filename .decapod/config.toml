schema_version = "1.0.0"

[context]
declared_sources = []

[custody]
isolation = "container"

[governance]
approval_categories = ["destructive_operations"]
protected_paths = []

[init]
ci = true
diagram_style = "ascii"
entrypoints = [
    "AGENTS.md",
    "CLAUDE.md",
    "GEMINI.md",
    "CODEX.md",
]
specs = true

[proof]
validation_buildkite_preflights = false

[[proof.commands]]
args = [
    "run",
    "--no-remote",
    "--no-npm",
    "--allow-read=.",
    "scripts/check-site.ts",
]
command = "deno"
description = "Compile browser script and verify document IDs, local assets and fragment references without network or application effects"
name = "static-source"
required = true

[proof.repository_contract]
reviewed_commands_digest = "sha256:aba12a3b46bf0a2e263126afc595f0afed5d63bc65b89d2f287e975209e8f8ee"

[proof.repository_contract.executions.static-source]
directory = "."
program = "/opt/homebrew/Cellar/deno/2.9.8/bin/deno"
timeout_seconds = 60

[proof.repository_contract.executions.static-source.environment]

[proof.repository_contract.executions.static-source.toolchain_files]
deno = "/opt/homebrew/Cellar/deno/2.9.8/bin/deno"

[[proof.repository_contract.source_coverage]]
ci_only = true
commands = []
reason = "Main-only/manual release workflow renders and verifies original media, installs checksum-verified Linux Decapod and commits vendored assets/governance with contents-write. Local static source checks do not execute this renderer or attest GitHub release/publication, credentials or hosted payment acceptance."
source = ".github/workflows/site-bootstrap.yml"

[proof.required_profile]
id = "repo.pr-readiness.v1"
reviewed_sources_digest = "sha256:4e9f04d9ec00b3c9d93dbc1637340f04436f4a0acc53d7c522fe358c260b0499"

[repo]
architecture_direction = "Architecture is not established by repository shape; inspect entrypoints, components, and their interactions."
backend = "local"
base_branch = "main"
container_workspaces = true
declared_capabilities = [
    "authentication",
    "background-processing",
    "event-driven",
    "external-integrations",
    "persistent-state",
    "public-api",
]
detected_surfaces = [
    "javascript",
    "python",
]
done_criteria = "Decapod validate passes, required tests pass, and promotion-relevant artifacts are present."
external_tracker = false
primary_languages = [
    "javascript",
    "python",
]
product_name = "decapodlabs.github.io"
product_summary = "This is the single-page Decapod landing page, published from the **organization-level** GitHub Pages repository:"
product_type = "service_or_library"

[tracker]
provider = "decapod"
