name: Render media and govern Decapod Labs homepage

on:
  push:
    branches: [main]
    paths:
      - index.html
      - styles.css
      - main.js
      - docs/decisions/**
      - scripts/**
      - assets/mascot.svg
      - assets/fonts/**
      - evidence/**
      - proof.html
      - .github/workflows/site-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: decapod-labs-site-bootstrap
  cancel-in-progress: true

jobs:
  initialize-and-vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Render website-owned Decapod mascot and product media
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg fonts-lato libcairo2 fonts-dejavu-core
          python3 -m pip install 'Pillow==11.3.0' 'numpy==2.3.4' 'CairoSVG==2.7.1'
          python3 scripts/render-showcase.py
          python3 scripts/generate-social.py

      - name: Verify generated visual artifacts
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          from PIL import Image
          root=pathlib.Path("assets")
          assets=["decapod-showcase.mp4","decapod-showcase.gif","decapod-poster.png",
                  "mascot.svg","mascot.png","mascot-github-avatar.png",
                  "social-preview.png","favicon.png"]
          for name in assets:
              p=root/name
              assert p.is_file() and p.stat().st_size>1000, name
          data=json.loads(subprocess.check_output([
              "ffprobe","-v","error",
              "-show_entries","format=duration:stream=codec_type,codec_name",
              "-of","json",str(root/"decapod-showcase.mp4")
          ],text=True))
          assert 6.0<=float(data["format"]["duration"])<7.0, data
          assert any(s["codec_name"]=="h264" for s in data["streams"])
          assert any(s["codec_name"]=="aac" for s in data["streams"])
          with Image.open(root/"decapod-showcase.gif") as gif:
              assert gif.n_frames >=80, gif.n_frames
          with Image.open(root/"mascot.png") as im:
              assert im.mode=="RGBA" and im.size==(1040,880)
          with Image.open(root/"mascot-github-avatar.png") as im:
              assert im.mode=="RGBA" and im.size==(1024,1024)
              alpha=im.getchannel("A")
              assert alpha.getextrema()==(0,255)
              bbox=alpha.getbbox()
              assert bbox is not None
              assert all((x-512)**2+(y-512)**2 <490**2
                for x in (bbox[0],bbox[2]) for y in (bbox[1],bbox[3]))
          print("Verified website-owned film, mascot exports, poster and social media.")
          PY

      - name: Regenerate the actual-agent launch film and verify encoded media
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/render-launch.py --evidence evidence/pi-1758-20261117-01
          python3 scripts/verify-launch.py

      - name: Install checksum-verified Decapod v0.148.0
        if: hashFiles('.decapod/config.toml') == ''
        shell: bash
        run: |
          set -euo pipefail
          archive=decapod-x86_64-unknown-linux-gnu.tar.xz
          url="https://github.com/DecapodLabs/decapod/releases/download/v0.148.0"
          curl --fail --location --retry 3 --silent --show-error "$url/$archive" -o "/tmp/$archive"
          curl --fail --location --retry 3 --silent --show-error "$url/$archive.sha256" -o "/tmp/$archive.sha256"
          expected=$(awk 'NR==1 {print $1}' "/tmp/$archive.sha256")
          actual=$(sha256sum "/tmp/$archive" | cut -d' ' -f1)
          test "$actual" = "$expected"
          mkdir -p /tmp/decapod-release
          tar -xJf "/tmp/$archive" -C /tmp/decapod-release
          bin=$(find /tmp/decapod-release -type f -name decapod -print -quit)
          test -n "$bin"
          sudo install -m 0755 "$bin" /usr/local/bin/decapod
          decapod --help > /tmp/decapod-command-help.txt
          sed -n "1,32p" /tmp/decapod-command-help.txt

      - name: Initialize real repository governance using Decapod
        if: hashFiles('.decapod/config.toml') == ''
        shell: bash
        run: |
          set -euo pipefail
          # This is a real Decapod invocation inside the Git checkout.
          # It must not be replaced with hand-written pretend governance files.
          decapod init
          test -d .decapod
          test -f .decapod/managed/specs/INTENT.md
          if ! grep -q '^## Decapod Labs website intent' .decapod/managed/specs/INTENT.md; then
            cat >> .decapod/managed/specs/INTENT.md <<'DOC'

          ## Decapod Labs website intent

          The human-authored source of intent is
          [docs/decisions/0001-site-intent.md](../../../../docs/decisions/0001-site-intent.md).
          The outcome is an independent, vibrant, public Decapod Labs landing page
          at https://decapodlabs.github.io/, linking to existing docs at
          https://decapodlabs.github.io/decapod/. AI coding agents operate through
          Decapod; humans run init once per project and continue their agent workflow.
          Preserve offline-first, bounded authority, current commit-specific proof,
          and the actual original film and mascot. Publication must be verified
          independently against the publicly served Pages URL.
          DOC
          fi
          echo "Decapod initialized this GitHub Actions checkout."

      - name: Commit vendored media and authentic initialized governance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Decapod init generates its native source-validation workflow. The
          # GitHub App token lacks "workflows" permission to install it. Keep
          # the exact generated file as reviewed evidence, but DO NOT bypass
          # that permission gate or pretend the validation workflow ran.
          if [ -f .github/workflows/decapod-validate.yml ]; then
            mkdir -p docs/decisions/bootstrap
            mv .github/workflows/decapod-validate.yml docs/decisions/bootstrap/decapod-validate.workflow.txt
            cat > docs/decisions/0002-workflow-installation-pending.md <<'NOTE'
          # Validation workflow installation pending

          Decapod v0.148.0 successfully executed `decapod init` in the official
          `DecapodLabs/decapodlabs.github.io` checkout during site bootstrap.
          The installer generated a native `.github/workflows/decapod-validate.yml`.
          The GitHub Actions installation token cannot create or modify a
          workflow file without the separate `workflows` permission. The prior
          run's commit was therefore rejected.

          The exact generated workflow text is retained in
          [bootstrap/decapod-validate.workflow.txt](bootstrap/decapod-validate.workflow.txt).
          It is **not** an installed or executed validation gate. Installation
          requires an authorized operator with workflow-writing permission.
          This explicit gap does not change the `.decapod/` specifications,
          accepted human intent, or make the website appear validated.
          NOTE
          fi
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(site): vendor verified artwork and initialize Decapod governance"
            git push origin "HEAD:main"
          fi
